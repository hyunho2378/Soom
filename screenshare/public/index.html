<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>동해 AI 교육 화면 공유</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 입장 화면 -->
<section id="joinScreen" class="join-screen">
  <div class="join-card">
    <div class="brand-mark">동해 AI 교육</div>
    <h1>화면 공유</h1>
    <p class="sub">같은 방 이름을 입력하면 서로의 화면을 실시간으로 봅니다.</p>
    <label for="roomInput">방 이름</label>
    <input id="roomInput" type="text" placeholder="예: 동해AI교육0811" maxlength="30" autocomplete="off" autofocus>
    <label for="nameInput">내 이름</label>
    <input id="nameInput" type="text" placeholder="예: 김현호" maxlength="20" autocomplete="off">
    <button id="joinBtn" class="btn-primary btn-join">입장하기</button>
    <p class="hint" id="joinHint" role="status"></p>
  </div>
</section>

<!-- 회의실 화면 -->
<section id="roomScreen" class="room-screen hidden">
  <header class="room-header">
    <div class="room-title">
      <span class="dot-live" id="dotLive" aria-hidden="true"></span>
      <h1 id="roomNameLabel"></h1>
    </div>
    <div class="room-actions">
      <span id="participantCount" class="participant-count"></span>
      <button id="leaveBtn" class="btn-ghost">나가기</button>
    </div>
  </header>

  <div class="room-body">
    <div class="viewer-area">
      <!-- 실시간 화면 / 실습 기록물 전환 탭 -->
      <div class="view-tabs" role="tablist" aria-label="회의실 보기">
        <button id="tabLive" class="view-tab is-active" role="tab" aria-selected="true" aria-controls="panelLive">실시간 화면</button>
        <button id="tabRecords" class="view-tab" role="tab" aria-selected="false" aria-controls="panelRecords">
          실습 기록물<span id="recordsBadge" class="tab-badge hidden">0</span>
        </button>
      </div>

      <!-- 실시간 화면 패널 -->
      <div id="panelLive" class="panel-live" role="tabpanel" aria-labelledby="tabLive">
        <div class="viewer-frame" id="viewerFrame">
          <video id="remoteVideo" autoplay playsinline></video>
          <div class="viewer-placeholder" id="viewerPlaceholder">
            <div class="placeholder-icon" aria-hidden="true">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
            </div>
            <p id="placeholderTitle">아직 화면을 공유하는 사람이 없습니다.</p>
            <p class="placeholder-sub" id="placeholderSub">아래 버튼으로 내 화면을 공유해보세요.</p>
          </div>
          <div class="presenter-badge hidden" id="presenterBadge"></div>
        </div>
        <div class="share-controls">
          <button id="shareBtn" class="btn-primary btn-share">
            <span class="icon-swap" aria-hidden="true">
              <svg class="icon-stop" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
              <svg class="icon-screen" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
            </span>
            <span id="shareBtnLabel">내 화면 공유하기</span>
          </button>
          <p class="share-status" id="shareStatus" role="status"></p>
        </div>
      </div>

      <!-- 실습 기록물 패널 -->
      <div id="panelRecords" class="panel-records hidden" role="tabpanel" aria-labelledby="tabRecords">
        <div class="records-head">
          <h2>실습 기록물<span id="recordsCount" class="records-count"></span></h2>
          <button id="resetRecordsBtn" class="btn-ghost btn-reset">전체 초기화</button>
        </div>

        <div class="record-form">
          <div class="form-row form-author">
            <span class="form-label">올리는 사람</span>
            <span id="recordAuthor" class="author-name"></span>
          </div>

          <div class="form-row">
            <span class="form-label" id="itemLabel">실습 항목</span>
            <div class="dropdown" id="itemDropdown">
              <button type="button" class="dropdown-trigger" id="itemTrigger"
                      role="combobox" aria-haspopup="listbox" aria-expanded="false"
                      aria-controls="itemPanel" aria-labelledby="itemLabel itemTriggerLabel">
                <span id="itemTriggerLabel" class="dropdown-placeholder">실습 항목 선택</span>
                <svg class="dropdown-caret" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
              <div class="dropdown-panel" id="itemPanel" role="listbox" tabindex="-1" aria-labelledby="itemLabel"></div>
            </div>
          </div>

          <div class="form-row">
            <label class="form-label" for="summaryInput">결과 요약</label>
            <textarea id="summaryInput" class="summary-input" rows="3" maxlength="2000" placeholder="무엇을 어떻게 했는지 간단히 적으세요."></textarea>
            <p class="summary-meta" id="summaryMeta" aria-live="off">0 / 2000</p>
          </div>

          <div class="form-row">
            <span class="form-label" id="attachLabel">이미지 첨부</span>
            <div class="attach-area">
              <button type="button" id="attachBtn" class="btn-attach" aria-describedby="attachLabel">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
                이미지 첨부하기
              </button>
              <input id="imageInput" type="file" accept="image/*" multiple hidden>
              <div id="previewList" class="preview-list"></div>
            </div>
          </div>

          <div class="form-submit-row">
            <button id="submitRecordBtn" class="btn-primary btn-submit-record">기록물 올리기</button>
            <p id="recordStatus" class="record-status" role="status"></p>
          </div>
        </div>

        <div id="recordsList" class="records-list"></div>
        <p id="recordsEmpty" class="records-empty">아직 올라온 기록물이 없습니다.</p>
      </div>
    </div>

    <aside class="participant-panel">
      <h2>참가자</h2>
      <ul id="participantList" class="participant-list"></ul>
    </aside>
  </div>
</section>

<!-- 이미지 확대 라이트박스 -->
<div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="첨부 이미지 확대">
  <button class="lightbox-close" id="lightboxClose">닫기</button>
  <button class="lightbox-nav lightbox-prev" id="lightboxPrev" aria-label="이전 이미지 보기">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
  </button>
  <img id="lightboxImg" class="lightbox-img" alt="첨부 이미지 확대">
  <button class="lightbox-nav lightbox-next" id="lightboxNext" aria-label="다음 이미지 보기">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
  </button>
  <p class="lightbox-count" id="lightboxCount"></p>
</div>

<!-- 초기화 확인 모달 -->
<div id="resetModal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="resetModalTitle">
  <div class="modal-card">
    <h3 id="resetModalTitle">기록물 전체 초기화</h3>
    <p class="modal-desc" id="resetModalDesc">이 방의 모든 기록물과 첨부 이미지를 삭제합니다. 되돌릴 수 없습니다.</p>
    <label for="resetConfirmInput" class="modal-label">확인하려면 아래에 초기화 라고 입력하세요.</label>
    <input id="resetConfirmInput" type="text" class="modal-input" placeholder="초기화" autocomplete="off">
    <div class="modal-actions">
      <button id="resetCancelBtn" class="btn-ghost">취소</button>
      <button id="resetConfirmBtn" class="btn-danger" disabled>초기화하기</button>
    </div>
    <p id="resetStatus" class="reset-status" role="status"></p>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
